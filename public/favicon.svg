<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="favGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="28" fill="url(#favGrad)" />
  <!-- Aperture ring -->
  <circle cx="60" cy="60" r="42" stroke="rgba(255,255,255,0.15)" stroke-width="3" />
  <circle cx="60" cy="60" r="32" stroke="rgba(255,255,255,0.25)" stroke-width="2" stroke-dasharray="4 4" />
  <!-- Monogram DN -->
  <text x="60" y="70" font-family="'Poppins', sans-serif" font-size="38" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="-1">DN</text>
  <!-- CMYK Accent Dots -->
  <circle cx="45" cy="94" r="3.5" fill="#00AEEF" />
  <circle cx="55" cy="94" r="3.5" fill="#EC008C" />
  <circle cx="65" cy="94" r="3.5" fill="#FFF200" />
  <circle cx="75" cy="94" r="3.5" fill="#231F20" stroke="#FFFFFF" stroke-width="0.7" />
</svg>

